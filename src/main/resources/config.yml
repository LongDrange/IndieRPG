# ============================================
# IndieRPG Configuration - Fully Customizable
# ============================================
# All values below can be changed without touching code.
# Restart or use /rpg reload to apply changes.
# ============================================

# ---------- General Settings ----------
general:
  prefix: "&d[IndieRPG] &r"
  debug: false

# ---------- Space Ring (Virtual Storage) ----------
spacering:
  trigger-items:
    - "&aBasic Space Ring"
    - "&9Advanced Space Ring"
    - "&6Supreme Space Ring"
    - "&dLegendary Space Ring"
  sizes:
    - 9
    - 27
    - 54
    - 54
  save-contents: true

# ---------- Soul Storage ----------
soulstorage:
  enabled: true
  trigger-items:
    - "&5Soul Storage Orb"
    - "&dSoul Pearl"
  size: -1
  rows-per-page: 6

# ---------- Talent System ----------
talent:
  enabled: true
  menu-title: "&d&lTalent System &7[Points: {points}]"
  trees:
    attack:
      display-name: "&c&lAttack"
      icon: DIAMOND_SWORD
      max-level: 20
      points-per-level: 1
      lore:
        - "&7Each level: &c+4 Attack Damage"
        - "&7Current: &f{level}/{max}"
      slot: 11
    defense:
      display-name: "&9&lDefense"
      icon: DIAMOND_CHESTPLATE
      max-level: 20
      points-per-level: 1
      lore:
        - "&7Each level: &9+4 Armor"
        - "&7Current: &f{level}/{max}"
      slot: 13
    health:
      display-name: "&a&lHealth"
      icon: APPLE
      max-level: 20
      points-per-level: 1
      lore:
        - "&7Each level: &a+10 Max Health"
        - "&7Current: &f{level}/{max}"
      slot: 15
    crit:
      display-name: "&e&lCrit"
      icon: GOLD_SWORD
      max-level: 10
      points-per-level: 2
      lore:
        - "&7Each level: &e+2% Crit Chance"
        - "&7Current: &f{level}/{max}"
      slot: 29
    lifesteal:
      display-name: "&4&lLifesteal"
      icon: RED_ROSE
      max-level: 10
      points-per-level: 2
      lore:
        - "&7Each level: &4+1% Lifesteal"
        - "&7Current: &f{level}/{max}"
      slot: 31
  gui-size: 45
  reset-slot: 40
  reset-refund-percent: 80

# ---------- Task System ----------
task:
  enabled: true
  required-kills: 15
  rewards:
    gold: 150
    talent-points: 5
    battlepass-xp: 50
  start-message: "&a[Task] &7Slayer task started! Kill {count} monsters."
  progress-message: "&a[Task] &7Progress: {kills}/{count}"
  complete-message: "&6[Task] &eTask complete! +{gold} Gold, +{points} Talent Points"

# ---------- Crate System ----------
crate:
  enabled: true
  trigger-items:
    common:
      - "&7Common Crate"
      - "&7普通宝箱"
    rare:
      - "&9Rare Crate"
      - "&9稀有宝箱"
    legendary:
      - "&6Legendary Crate"
      - "&6传说宝箱"
  rewards:
    common:
      - chance: 0.60
        gold: 10
        talent-points: 0
        battlepass-xp: 5
      - chance: 0.30
        gold: 50
        talent-points: 0
        battlepass-xp: 10
      - chance: 0.10
        gold: 100
        talent-points: 1
        battlepass-xp: 20
    rare:
      - chance: 0.50
        gold: 100
        talent-points: 1
        battlepass-xp: 20
      - chance: 0.35
        gold: 250
        talent-points: 2
        battlepass-xp: 40
      - chance: 0.15
        gold: 500
        talent-points: 3
        battlepass-xp: 80
    legendary:
      - chance: 0.40
        gold: 500
        talent-points: 3
        battlepass-xp: 80
      - chance: 0.35
        gold: 1000
        talent-points: 5
        battlepass-xp: 150
      - chance: 0.25
        gold: 2500
        talent-points: 10
        battlepass-xp: 300

# ---------- Rank System ----------
rank:
  enabled: true
  items:
    "Warrior Title": "warrior"
    "Knight Title": "knight"
    "Legend Title": "legend"
    "Mythic Title": "mythic"
  ranks:
    default:
      display: "&7&l[Rookie]"
      chat-prefix: "&7[Rookie] "
    warrior:
      display: "&c&l[Warrior]"
      chat-prefix: "&c[Warrior] "
    knight:
      display: "&f&l[Knight]"
      chat-prefix: "&f[Knight] "
    elite:
      display: "&b&l[Elite]"
      chat-prefix: "&b[Elite] "
    legend:
      display: "&6&l[Legend]"
      chat-prefix: "&6[Legend] "
    mythic:
      display: "&5&l[Mythic]"
      chat-prefix: "&5[Mythic] "

# ---------- BattlePass ----------
battlepass:
  enabled: true
  xp-per-level: 100
  max-level: 100
  kill-xp: 5
  milestone-every: 10
  milestone-rewards:
    talent-points: 5
    gold: 500
  gold-per-level: 10

# ---------- Economy ----------
economy:
  enabled: true
  starting-gold: 0

