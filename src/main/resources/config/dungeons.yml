dungeons:
  goblin_cave:
    name: "&a哥布林洞穴"
    template-world: "dungeon_goblin"
    min-level: 5
    max-players: 4
    time-limit: 1800
    cooldown: 3600
    waves:
      - mobs: ["Goblin", "Goblin", "GoblinArcher"]
      - mobs: ["Goblin", "GoblinArcher", "GoblinArcher"]
      - mobs: ["GoblinChief"]
    rewards:
      gold: 5000
      battle-pass-exp: 200
      item: "growth_core"
      commands:
        - "give {player} diamond 5"
        - "say {player} 完成了 {dungeon}！耗時 {time} 秒"
    affixes:
      enabled: true
      chance: 0.3
      list:
        - id: "burning"
          name: "&c燃燒"
          bonus-health: 1.5
          bonus-damage: 1.0
        - id: "swift"
          name: "&b迅捷"
          bonus-speed: 0.4
        - id: "giant"
          name: "&6巨大"
          bonus-health: 2.5
        - id: "elite"
          name: "&d精英"
          bonus-health: 2.0
          bonus-damage: 2.0

  abyss_temple:
    name: "&5深淵神殿"
    template-world: "dungeon_abyss"
    min-level: 30
    max-players: 4
    time-limit: 2400
    cooldown: 7200
    waves:
      - mobs: ["AbyssWraith", "AbyssWraith", "AbyssHound"]
      - mobs: ["AbyssPriest", "AbyssPriest"]
      - mobs: ["AbyssLord"]
    rewards:
      gold: 20000
      battle-pass-exp: 500
      item: "abyss_ring"
      commands:
        - "give {player} diamond 20"
        - "broadcast &5{player} &f成功挑戰深淵神殿！耗時 {time} 秒"
    affixes:
      enabled: true
      chance: 0.5
      list:
        - id: "void"
          name: "&5虛空"
          bonus-health: 2.0
          bonus-damage: 3.0
        - id: "frenzy"
          name: "&4狂暴"
          bonus-speed: 0.6
          bonus-damage: 2.0