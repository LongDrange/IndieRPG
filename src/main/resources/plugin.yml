name: LDAPI
version: 1.0.0
main: com.indie.rpg.IndieRPG
api-version: 1.12
author: LongDrange
description: LDAPI 中文 RPG 核心，支援 Minecraft 1.12.2 Paper 與 MythicMobs 4.13.0
softdepend: [MythicMobs, PlaceholderAPI]
commands:
  ldapi:
    description: LDAPI 主指令
    aliases: [ld]
  spacering:
    description: 開啟空間戒指
    aliases: [sr, ldsr]
  talent:
    description: 開啟天賦
    aliases: [talents, ldtalent]
  task:
    description: 開始任務
    aliases: [ldtask]
  crate:
    description: 開啟寶箱
    aliases: [ldcrate]
  job:
    description: 職業系統
    aliases: [jobs, ldjob]
  party:
    description: 隊伍系統
    aliases: [pt, ldparty]
  guild:
    description: 公會系統
    aliases: [g, ldguild]
  dungeon:
    description: 副本系統
    aliases: [dg, lddungeon]
  pet:
    description: 寵物系統
    aliases: [pets, ldpets]
  rep:
    description: 聲望系統
    aliases: [reputation, ldrep]
  npc:
    description: NPC 對話
    aliases: [ldnpc]
permissions:
  ldapi.admin:
    description: LDAPI 管理員權限
    default: op
  ldapi.user:
    description: LDAPI 玩家權限
    default: true
