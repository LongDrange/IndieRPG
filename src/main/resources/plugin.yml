name: LDAPI
version: 1.0.0
main: com.indie.rpg.IndieRPG
api-version: 1.12
author: LongDrange
description: LDAPI 中文 RPG API，支援獨立配置、Lore、飾品成長與 MythicMobs 4.13.0
softdepend: [MythicMobs, PlaceholderAPI]
commands:
  ldapi:
    description: LDAPI 主指令
    aliases: [ld, led]
  spacering:
    description: 開啟空間戒指
    aliases: [sr, ldsr]
  talent:
    description: 開啟天賦介面
    aliases: [talents, ldtalent]
  task:
    description: 開始任務
    aliases: [ldtask]
  crate:
    description: 開啟寶箱
    aliases: [ldcrate]
permissions:
  ldapi.admin:
    description: LDAPI 管理員權限
    default: op
  ldapi.user:
    description: LDAPI 玩家權限
    default: true
