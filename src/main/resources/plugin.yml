name: IndieRPG
version: 4.0.0
main: com.indie.rpg.IndieRPG
api-version: 1.12
author: Indie
description: Full RPG suite - space ring, soul storage (multi-page), talents with real effects, tasks, crates, ranks, battlepass, daily rewards, gold shop, monster cards, bestiary guide, jewelry slots, item exchange. Compatible with MythicMobs via lore ID detection.
depend: []
softdepend: [MythicMobs, PlaceholderAPI]
commands:
  indierpg:
    description: Main command
    aliases: [irpg, rpg]
  spacering:
    description: Open space ring
    aliases: [sr]
  talent:
    description: Open talent menu
    aliases: [talents]
  task:
    description: Start task
  crate:
    description: Open crate
permissions:
  indierpg.admin:
    description: Admin permission
    default: op
  indierpg.user:
    description: User permission
    default: true
