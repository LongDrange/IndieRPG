name: IndieRPG
version: 2.0.0
main: com.indie.rpg.IndieRPG
api-version: 1.12
author: Indie
description: Fully config-driven RPG plugin - space ring, talents, tasks, crates, ranks, battlepass. Compatible with MythicMobs but not dependent.
depend: []
softdepend: [MythicMobs, PlaceholderAPI]
commands:
  indierpg:
    description: Main command
    aliases: [irpg, rpg]
  spacering:
    description: Open space ring
    aliases: [sr]
  talent:
    description: Open talent menu
    aliases: [talents]
  task:
    description: Start task
  crate:
    description: Open crate
permissions:
  indierpg.admin:
    description: Admin permission
    default: op
  indierpg.user:
    description: User permission
    default: true
